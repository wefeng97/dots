# include ~/.config/kitty/mydracula.conf
# Fonts
font_family      Maple Mono
font_size        18
bold_font        auto
italic_font      auto
bold_italic_font auto

# Cursor Settings 
cursor_shape     block
cursor_beam_thickness 1.5
cursor_blink_interval 0.75
cursor_stop_blinking_after 30.0
# shell_integration no-cursor

# Mouse & url
mouse_hide_wait  2.0
copy_on_select yes

# url_color        #0087bd
url_style        straight

#Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.98

# Don't restore the last window's size/state: a saved "maximized" state
# makes every new window ask Hyprland to maximize instead of tiling
remember_window_size no

# Scrolling
scrollback_lines 20000
touch_scroll_multiplier 3.0

# Window 
# active_border_color #F9E2AF
# inactive_border_color #cccccc
background_blur 10

## VERY IMPORTANT: paste_actions
# replace-newline stops multi-line pastes from running line by line in the shell;
# quote-urls-at-prompt,confirm are kitty's defaults, kept since this list replaces them
paste_actions quote-urls-at-prompt,confirm,replace-newline,confirm-if-large
# Programs may write to the clipboard freely, but must ask before reading it
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME
